[workspace]
resolver = "2"
members = ["core", "desktop", "ui"]
default-members = ["core", "desktop"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"

[profile.release.package.sillune-ui]
opt-level = "s"
