[package]
name = "sillune-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
js-sys = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Document", "Element", "Event", "EventTarget", "HtmlAudioElement", "HtmlElement", "HtmlInputElement", "HtmlMediaElement", "HtmlTextAreaElement", "KeyboardEvent", "MediaQueryList", "MouseEvent", "Navigator", "ScrollBehavior", "ScrollIntoViewOptions", "Window"] }
